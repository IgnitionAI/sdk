name: Publish npm release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag to retry
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve contract metadata with the pinned workflow implementation
        id: sdk-contract
        env:
          AUTOMATION_COMMIT: ${{ github.workflow_sha }}
        run: |
          git fetch origin "${AUTOMATION_COMMIT}" --depth=1
          git show "${AUTOMATION_COMMIT}:.github/workflows/sdk-contract-inputs.ts" > "${RUNNER_TEMP}/sdk-contract-inputs.ts"
          git show "${AUTOMATION_COMMIT}:.github/workflows/sdk-contract-policy.json" > "${RUNNER_TEMP}/sdk-contract-policy.json"
          bun run "${RUNNER_TEMP}/sdk-contract-inputs.ts" \
            --root "${GITHUB_WORKSPACE}" \
            --policy "${RUNNER_TEMP}/sdk-contract-policy.json"
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.18.0
      - name: Verify OIDC runtime identity
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npm --version
          echo "repository=${GITHUB_REPOSITORY} workflow=release.yml ref=${RELEASE_TAG} environment=npm"
      - name: Exchange GitHub OIDC for a package-scoped npm token
        env:
          AUTOMATION_COMMIT: ${{ github.workflow_sha }}
        run: |
          git fetch origin "${AUTOMATION_COMMIT}" --depth=1
          git show "${AUTOMATION_COMMIT}:scripts/exchange-npm-oidc.ts" > "${RUNNER_TEMP}/exchange-npm-oidc.ts"
          bun run "${RUNNER_TEMP}/exchange-npm-oidc.ts"
      - name: Install exact dependencies
        working-directory: typescript
        run: bun install --frozen-lockfile
      - name: Verify, test and build
        working-directory: typescript
        env:
          CONTRACT_PATH: ${{ steps.sdk-contract.outputs.contract_path }}
          MINIMUM_RELEASE_SEQUENCE: ${{ steps.sdk-contract.outputs.minimum_release_sequence }}
          REQUIRE_SDK_IDENTITY: ${{ steps.sdk-contract.outputs.require_sdk_identity }}
          PREVIOUS_CONTRACTS_JSON: ${{ steps.sdk-contract.outputs.previous_contracts_json }}
        run: |
          strict_identity_args=()
          case "${REQUIRE_SDK_IDENTITY}" in
            true) strict_identity_args=(--require-sdk-identity) ;;
            false) ;;
            *) echo "Invalid SDK identity policy output" >&2; exit 1 ;;
          esac
          bun run verify:contract -- \
            --contract "../${CONTRACT_PATH}" \
            --minimum-release-sequence "${MINIMUM_RELEASE_SEQUENCE}" \
            "${strict_identity_args[@]}"
          previous_args=()
          while IFS= read -r version; do
            previous_args+=(--previous-contract "${version}")
          done < <(jq -r '.[]' <<< "${PREVIOUS_CONTRACTS_JSON}")
          bun run generate:types -- --contract "../${CONTRACT_PATH}" "${previous_args[@]}"
          git diff --exit-code -- src/generated/public-api.ts src/contract.ts
          bun run typecheck
          bun test
          bun run build
      - name: Validate release tag and public boundary
        run: bun run scripts/validate-release.ts "${RELEASE_TAG}"
      - name: Publish release candidate with OIDC
        if: contains(env.RELEASE_TAG, '-rc.')
        working-directory: typescript
        run: npm publish --access public --tag next --provenance
      - name: Publish stable with OIDC
        if: ${{ !contains(env.RELEASE_TAG, '-rc.') }}
        working-directory: typescript
        run: npm publish --access public --tag latest --provenance
      - name: Remove ephemeral npm credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/ignition-sdk-oidc.npmrc"
